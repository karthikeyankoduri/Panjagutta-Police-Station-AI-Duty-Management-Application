plugins {
    id 'com.android.application'
}

android {
    namespace 'com.panjagutta.dutymanagement'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    def configuredApiBaseUrl = (project.findProperty('API_BASE_URL') ?: '')
            .toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"')

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.panjagutta.dutymanagement'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${configuredApiBaseUrl}\""
    }

    buildTypes {
        debug {
            manifestPlaceholders = [allowCleartextTraffic: 'true']
        }
        release {
            manifestPlaceholders = [allowCleartextTraffic: 'false']
        }
    }
}
