plugins {
    id 'com.android.application'
}

android {
    namespace 'com.panjagutta.dutymanagement'
    compileSdk 35

    def configuredApiBaseUrl = (project.findProperty('API_BASE_URL') ?: '')
            .toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"')

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.panjagutta.dutymanagement'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${configuredApiBaseUrl}\""
    }

    buildTypes {
        debug {
            manifestPlaceholders = [allowCleartextTraffic: 'true']
        }
        release {
            manifestPlaceholders = [allowCleartextTraffic: 'false']
        }
    }
}
dependencies {
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

// RoleAccessTest reads the shared web/app access rules. Declare the file as a test input so that
// editing it always re-runs the test (otherwise Gradle reports the test as up to date).
tasks.withType(Test).configureEach {
    inputs.file("$rootDir/../frontend/src/lib/access-matrix.json").withPropertyName("accessMatrix")
}
