# Panjagutta Duty Management — one-command stack:
#   cp .env.example .env   (then set the secrets)
#   docker compose up -d --build
# Open https://<server>/ . The API is served under /api through the same HTTPS proxy.
services:
  db:
    image: postgres:15-alpine
    container_name: panjagutta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panjagutta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-panjagutta_duty_db}
    # Not published on the host: only the backend (and the backup job) can reach the database.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panjagutta} -d ${POSTGRES_DB:-panjagutta_duty_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: panjagutta_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-panjagutta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-panjagutta_duty_db}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (at least 32 random characters)}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_INACTIVITY_TIMEOUT_MINUTES: ${AUTH_INACTIVITY_TIMEOUT_MINUTES:-30}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    container_name: panjagutta_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    container_name: panjagutta_proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs
      - ./docker/ensure-cert.sh:/docker-entrypoint.d/05-ensure-cert.sh:ro

volumes:
  pgdata:
